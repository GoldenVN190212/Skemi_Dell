    <style>
        .sub-page {
            max-width: 1180px;
            margin: 0 auto;
            padding: 48px 24px 96px;
        }

        .sub-hero {
            text-align: center;
            margin-bottom: 44px;
        }

        .sub-hero .sub-eyebrow {
            display: inline-block;
            font-size: 0.78rem;
            font-weight: 700;
            letter-spacing: 0.14em;
            text-transform: uppercase;
            color: var(--brand-primary);
            background: color-mix(in srgb, var(--brand-primary) 12%, transparent);
            padding: 6px 14px;
            border-radius: 999px;
            margin-bottom: 18px;
        }

        .sub-hero h1 {
            font-size: clamp(2rem, 4vw, 2.9rem);
            font-weight: 800;
            margin: 0 0 14px;
            line-height: 1.1;
            background: linear-gradient(120deg, var(--brand-primary), var(--brand-secondary));
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .sub-hero p {
            font-size: 1.05rem;
            color: var(--text-muted);
            max-width: 620px;
            margin: 0 auto;
            line-height: 1.6;
        }

        .sub-billing-note {
            margin-top: 18px;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            font-size: 0.86rem;
            color: var(--text-muted);
            background: var(--bg-secondary);
            border: 1px solid var(--border-light);
            padding: 8px 16px;
            border-radius: 999px;
        }

        .plan-grid-sub {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px;
            align-items: stretch;
        }

        .plan {
            position: relative;
            display: flex;
            flex-direction: column;
            background: var(--bg-secondary);
            border: 1px solid var(--border-light);
            border-radius: var(--radius-lg, 20px);
            padding: 28px 24px;
            transition: transform 0.25s ease, box-shadow 0.25s ease, border-color 0.25s ease;
        }

        .plan:hover {
            transform: translateY(-6px);
            border-color: var(--brand-primary);
            box-shadow: 0 18px 48px color-mix(in srgb, var(--brand-primary) 16%, transparent);
        }

        .plan.is-popular {
            border-color: var(--brand-primary);
            background: linear-gradient(180deg, color-mix(in srgb, var(--brand-primary) 8%, var(--bg-secondary)), var(--bg-secondary));
            box-shadow: 0 18px 52px color-mix(in srgb, var(--brand-primary) 22%, transparent);
        }

        .plan.is-ultimate {
            border-color: color-mix(in srgb, var(--brand-secondary) 60%, var(--border-light));
            background: linear-gradient(180deg, color-mix(in srgb, var(--brand-secondary) 10%, var(--bg-secondary)), var(--bg-secondary));
        }

        .plan-badge {
            position: absolute;
            top: -13px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 0.72rem;
            font-weight: 800;
            letter-spacing: 0.06em;
            text-transform: uppercase;
            color: #fff;
            background: linear-gradient(120deg, var(--brand-primary), var(--brand-secondary));
            padding: 6px 16px;
            border-radius: 999px;
            white-space: nowrap;
            box-shadow: 0 6px 18px color-mix(in srgb, var(--brand-primary) 40%, transparent);
        }

        .plan-icon {
            font-size: 1.6rem;
            margin-bottom: 8px;
        }

        .plan-name {
            font-size: 1.25rem;
            font-weight: 800;
            margin: 0 0 4px;
            color: var(--text-primary);
        }

        .plan-tagline {
            font-size: 0.85rem;
            color: var(--text-muted);
            min-height: 38px;
            line-height: 1.4;
            margin-bottom: 14px;
        }

        .plan-price {
            display: flex;
            align-items: baseline;
            gap: 6px;
            margin-bottom: 4px;
        }

        .plan-price .amount {
            font-size: 1.9rem;
            font-weight: 800;
            color: var(--text-primary);
            letter-spacing: -0.01em;
        }

        .plan-price .period {
            font-size: 0.82rem;
            color: var(--text-muted);
            font-weight: 600;
        }

        .plan-price-sub {
            font-size: 0.76rem;
            color: var(--text-muted);
            margin-bottom: 20px;
            min-height: 16px;
        }

        .plan-cta {
            width: 100%;
            padding: 12px 16px;
            font-size: 0.95rem;
            font-weight: 700;
            border-radius: var(--radius-md, 12px);
            cursor: pointer;
            border: 1px solid transparent;
            transition: filter 0.2s ease, transform 0.15s ease;
            margin-bottom: 22px;
        }

        .plan-cta:hover:not(:disabled) {
            filter: brightness(1.06);
            transform: translateY(-1px);
        }

        .plan-cta.cta-primary {
            background: linear-gradient(120deg, var(--brand-primary), var(--brand-secondary));
            color: #fff;
        }

        .plan-cta.cta-outline {
            background: transparent;
            color: var(--brand-primary);
            border-color: color-mix(in srgb, var(--brand-primary) 50%, transparent);
        }

        .plan-cta.cta-ultimate {
            background: linear-gradient(120deg, var(--brand-secondary), #9d4edd);
            color: #fff;
        }

        .plan-cta:disabled {
            cursor: default;
            background: var(--bg-tertiary, var(--bg-primary));
            color: var(--text-muted);
            border-color: var(--border-light);
            filter: none;
            transform: none;
        }

        .plan-feats {
            list-style: none;
            padding: 0;
            margin: 0;
            display: flex;
            flex-direction: column;
            gap: 11px;
        }

        .plan-feats li {
            display: flex;
            align-items: flex-start;
            gap: 9px;
            font-size: 0.88rem;
            line-height: 1.45;
            color: var(--text-primary);
        }

        .plan-feats li .fi {
            flex: none;
            margin-top: 1px;
            color: var(--brand-primary);
            font-weight: 800;
        }

        .plan-feats li.off {
            color: var(--text-muted);
            opacity: 0.7;
        }

        .plan-feats li.off .fi {
            color: var(--text-muted);
        }

        .sub-note {
            margin-top: 40px;
            text-align: center;
            font-size: 0.85rem;
            color: var(--text-muted);
            line-height: 1.6;
        }

        .sub-faq {
            max-width: 760px;
            margin: 72px auto 0;
        }

        .sub-faq h2 {
            text-align: center;
            font-size: 1.6rem;
            font-weight: 800;
            letter-spacing: -0.01em;
            margin: 0 0 6px;
            color: var(--text-primary);
        }

        .sub-faq .faq-sub {
            text-align: center;
            color: var(--text-muted);
            font-size: 0.95rem;
            margin: 0 0 28px;
        }

        .sub-faq details {
            background: var(--bg-secondary);
            border: 1px solid var(--border-light);
            border-radius: var(--radius-lg, 16px);
            margin-bottom: 12px;
            overflow: hidden;
            transition: border-color var(--transition-fast), box-shadow var(--transition-fast),
                        background var(--transition-fast);
        }

        .sub-faq details:hover {
            border-color: var(--border-medium);
            box-shadow: var(--shadow-sm);
        }

        .sub-faq details[open] {
            border-color: color-mix(in srgb, var(--brand-primary) 35%, var(--border-light));
            box-shadow: 0 12px 32px -22px color-mix(in srgb, var(--brand-primary) 65%, transparent);
        }

        .sub-faq summary {
            cursor: pointer;
            font-weight: 700;
            font-size: 1rem;
            color: var(--text-primary);
            list-style: none;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            padding: 18px 20px;
            transition: color var(--transition-fast);
        }

        .sub-faq summary::-webkit-details-marker {
            display: none;
        }

        .sub-faq summary:hover { color: var(--brand-primary); }

        .sub-faq .faq-chevron {
            flex: 0 0 auto;
            width: 9px;
            height: 9px;
            margin-right: 4px;
            border-right: 2px solid var(--text-muted);
            border-bottom: 2px solid var(--text-muted);
            transform: rotate(45deg);
            transition: transform var(--transition-fast), border-color var(--transition-fast);
        }

        .sub-faq details[open] summary { color: var(--brand-primary); }
        .sub-faq details[open] .faq-chevron {
            transform: rotate(225deg);
            border-color: var(--brand-primary);
        }

        .sub-faq p {
            margin: 0;
            padding: 0 20px 18px;
            color: var(--text-muted);
            font-size: 0.92rem;
            line-height: 1.65;
        }

        /* checkout modal */
        .sub-modal-backdrop {
            position: fixed;
            inset: 0;
            background: rgba(8, 4, 22, 0.55);
            backdrop-filter: blur(4px);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 12000;
            padding: 20px;
        }

        .sub-modal-backdrop.open {
            display: flex;
        }

        .sub-modal {
            width: 100%;
            max-width: 420px;
            background: var(--bg-secondary);
            border: 1px solid var(--border-light);
            border-radius: var(--radius-lg, 20px);
            padding: 28px 26px;
            box-shadow: 0 30px 80px rgba(0, 0, 0, 0.4);
            animation: subModalIn 0.25s ease;
        }

        @keyframes subModalIn {
            from { opacity: 0; transform: translateY(14px) scale(0.98); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        .sub-modal h3 {
            margin: 0 0 6px;
            font-size: 1.2rem;
            font-weight: 800;
            color: var(--text-primary);
        }

        .sub-modal .sub-modal-plan {
            font-weight: 800;
            color: var(--brand-primary);
        }

        .sub-modal p {
            color: var(--text-muted);
            font-size: 0.9rem;
            line-height: 1.6;
            margin: 10px 0 0;
        }

        .sub-modal-actions {
            display: flex;
            gap: 10px;
            margin-top: 22px;
        }

        .sub-modal-actions button {
            flex: 1;
            padding: 11px 16px;
            border-radius: var(--radius-md, 12px);
            font-weight: 700;
            cursor: pointer;
            border: 1px solid var(--border-light);
            background: transparent;
            color: var(--text-primary);
            transition: filter 0.2s ease;
        }

        .sub-modal-actions .btn-confirm {
            border: none;
            background: linear-gradient(120deg, var(--brand-primary), var(--brand-secondary));
            color: #fff;
        }

        .sub-modal-actions button:hover {
            filter: brightness(1.06);
        }

        @media (max-width: 1024px) {
            .plan-grid-sub { grid-template-columns: repeat(2, 1fr); }
        }

        @media (max-width: 560px) {
            .plan-grid-sub { grid-template-columns: 1fr; }
        }
    </style>
</head>

                            'Tải tài liệu & phòng Quiz không giới hạn',
                            'Ưu tiên GPU/VRAM tuyệt đối',
                            'Truy cập Beta tính năng mới sớm',
                            'Chat nhóm lưu 7 ngày',
                            'Danh hiệu VIP'
                        ]
                    },
                    en: {
                        name: 'Advanced', tagline: 'For power users who need force & automation.',
                        feats: [
                            'Everything in Pro, near-unlimited (Fair Use)',
                            'Unlimited Deep Research runs',
                            'Skemi Control (Phantom virtual desktop) — task automation',
                            'Unlimited uploads & Quiz rooms',
                            'Absolute GPU/VRAM priority',
                            'Early Beta access to new features',
                            'Group chat kept 7 days',
                            'VIP badge'
                        ]
                    }
                },
                {
                    id: 'skemi', icon: '👑', price: '4.990.000đ', ultimate: true,
                    cta: 'cta-ultimate',
                    vi: {
                        name: 'Skemi', tagline: 'Trọn bộ sức mạnh, cho cá nhân và đội nhóm nghiêm túc.',
                        feats: [
                            'Mọi thứ không giới hạn (Fair Use cao nhất)',
                            'Truy cập API Skemi',
                            'Ưu tiên tính toán cao nhất, độ trễ thấp nhất',
                            'Sớm dùng mọi tính năng frontier',
                            'Hỗ trợ tận tay (white-glove) & quản lý riêng',
                            'Sẵn sàng nhiều chỗ ngồi cho nhóm/đội',
                            'Danh hiệu Skemi độc quyền'
                        ]
                    },
                    en: {
                        name: 'Skemi', tagline: 'The full force, for serious individuals and teams.',
                        feats: [
                            'Everything unlimited (highest Fair Use)',
                            'Skemi API access',
                            'Highest compute priority, lowest latency',
                            'Early access to every frontier feature',
                            'White-glove support & dedicated manager',
                            'Multi-seat ready for teams',
                            'Exclusive Skemi badge'
                        ]
                    }
                }
            ];

            // ---- current plan ----
            var currentTier = 'free';
            try {
                var u = (typeof loadUserData === 'function') ? loadUserData() : (window.loadUserData ? window.loadUserData() : null);
                if (u && u.subscription) currentTier = String(u.subscription).toLowerCase();
            } catch (e) { /* default free */ }

            function esc(s) {
                return String(s == null ? '' : s)
                    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
                    .replace(/"/g, '&quot;');
            }

            function toast(msg) {
                if (typeof window.showToast === 'function') { window.showToast(msg); return; }
                var d = document.createElement('div');
                d.textContent = msg;
                d.style.cssText = 'position:fixed;left:50%;bottom:32px;transform:translateX(-50%);background:var(--bg-secondary);color:var(--text-primary);border:1px solid var(--border-light);padding:12px 18px;border-radius:12px;z-index:13000;box-shadow:0 10px 30px rgba(0,0,0,.3);font-size:.9rem;';
                document.body.appendChild(d);
                setTimeout(function () { d.remove(); }, 2800);
            }

            // ---- render hero/static text ----
            document.documentElement.lang = LANG;
            document.getElementById('subEyebrow').textContent = T.eyebrow;
            document.getElementById('subTitle').textContent = T.title;
            document.getElementById('subSubtitle').textContent = T.subtitle;
            document.getElementById('subBillingNote').textContent = T.billing;
            document.getElementById('subNote').textContent = T.note;
            document.getElementById('subModalTitle').textContent = T.modalTitle;
            document.getElementById('subModalClose').textContent = T.modalLater;
            document.getElementById('subModalConfirm').textContent = T.modalConfirm;

            // ---- render plan cards (re-runnable when server tier arrives) ----
            var grid = document.getElementById('planGrid');
            function renderCards() {
                grid.innerHTML = PLANS.map(function (p) {
                    var L = p[LANG];
                    var cls = 'plan' + (p.popular ? ' is-popular' : '') + (p.ultimate ? ' is-ultimate' : '') + (p.id === currentTier ? ' is-current' : '');
                    var badge = p.popular ? '<div class="plan-badge">' + (LANG === 'en' ? 'Most popular' : 'Phổ biến nhất') + '</div>' : '';
                    var isCurrent = (p.id === currentTier);
                    var feats = L.feats.map(function (f) {
                        var off = f.indexOf('off:') === 0;
                        var text = off ? f.slice(4) : f;
                        return '<li class="' + (off ? 'off' : '') + '"><span class="fi">' + (off ? '✕' : '✓') + '</span><span>' + esc(text) + '</span></li>';
                    }).join('');
                    var ctaLabel = isCurrent ? T.current : (LANG === 'en' ? 'Choose ' + L.name : 'Chọn ' + L.name);
                    var ctaCls = isCurrent ? '' : p.cta;
                    var btn = '<button class="plan-cta ' + ctaCls + '" data-plan="' + p.id + '" data-name="' + esc(L.name) + '"' + (isCurrent ? ' disabled' : '') + '>' + esc(ctaLabel) + '</button>';
                    return '<div class="' + cls + '">' + badge +
                        '<div class="plan-icon">' + p.icon + '</div>' +
                        '<div class="plan-name">' + esc(L.name) + '</div>' +
                        '<div class="plan-tagline">' + esc(L.tagline) + '</div>' +
                        '<div class="plan-price"><span class="amount">' + esc(p.price) + '</span>' +
                        (p.id === 'free' ? '' : '<span class="period">' + esc(T.period) + '</span>') + '</div>' +
                        '<div class="plan-price-sub">' + esc(p.priceSub || '') + '</div>' +
                        btn +
                        '<ul class="plan-feats">' + feats + '</ul>' +
                        '</div>';
                }).join('');
            }
            renderCards();

            // Prefer the server's authoritative tier once entitlements load.
            try {
                if (window.SkemiEntitlements && window.SkemiEntitlements.ready) {
                    window.SkemiEntitlements.ready.then(function (d) {
                        if (d && d.tier && d.tier !== currentTier) {
                            currentTier = String(d.tier).toLowerCase();
                            renderCards();
                        }
                    });
                }
            } catch (e) { /* keep local tier */ }

            // ---- render FAQ ----
            var faq = document.getElementById('subFaq');
            faq.innerHTML = '<h2>' + esc(T.faqTitle) + '</h2>'
                + (T.faqSub ? '<p class="faq-sub">' + esc(T.faqSub) + '</p>' : '')
                + T.faq.map(function (q) {
                    return '<details><summary><span>' + esc(q[0]) + '</span>'
                        + '<span class="faq-chevron" aria-hidden="true"></span></summary>'
                        + '<p>' + esc(q[1]) + '</p></details>';
                }).join('');

            // ---- checkout modal (NO real payment) ----
            var backdrop = document.getElementById('subModalBackdrop');
            var modalBody = document.getElementById('subModalBody');
            function openModal(name) {
                modalBody.innerHTML = T.modalBody(esc(name));
                backdrop.classList.add('open');
            }
            function closeModal() { backdrop.classList.remove('open'); }
            document.getElementById('subModalClose').onclick = closeModal;
            document.getElementById('subModalConfirm').onclick = function () { closeModal(); toast(T.interested); };
            backdrop.addEventListener('click', function (e) { if (e.target === backdrop) closeModal(); });

            grid.addEventListener('click', function (e) {
                var b = e.target.closest('.plan-cta');
                if (!b || b.disabled) return;
                var id = b.getAttribute('data-plan');
                if (id === currentTier) { toast(T.alreadyOn); return; }
                openModal(b.getAttribute('data-name'));
            });

            // entrance animation
            if (window.gsap) {
                window.gsap.from('.plan', { opacity: 0, y: 22, stagger: 0.08, duration: 0.5, ease: 'power2.out' });
            }
        })();
    </script>
</body>

</html>
