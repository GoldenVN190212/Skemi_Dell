        .embed-offline.hidden { display: none; }
        .embed-offline h2 { font-size: 1.6rem; margin: 0; letter-spacing: .5px; }
        .embed-offline p { max-width: 540px; line-height: 1.6; opacity: .8; margin: 0; font-size: .95rem; }
        .embed-offline code { background: rgba(125,125,160,.18); padding: 3px 8px; border-radius: 6px; font-size: .85rem; }
        .embed-retry { cursor: pointer; border: 0; background: var(--accent, #f472b6); color: #fff; padding: 12px 26px; border-radius: 999px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; font-size: .72rem; }

    <script>
        // The Quiz section IS the gamification "Đấu Trường AI" arena, embedded +
        // theme-synced. Health-probe the service so users see a friendly notice
        // instead of a raw connection error.
        (function () {
            // Served SAME-ORIGIN through Server.py's mount of the real skemi_quiz
            // backend (FastAPI, real WebSocket PvP + ELO matchmaking) — replaces
            // the old /arena reverse proxy to the fake-matchmaking Node app.
            const SERVICE_URL = location.origin + '/quiz/quiz.html';
            const HEALTH_URL = location.origin + '/api/quiz/queue/flux/status';
            const frame = document.getElementById('embedFrame');
            const offline = document.getElementById('embedOffline');
            const retry = document.getElementById('embedRetry');
            let connected = false;

            function identityQuery() {
                const p = new URLSearchParams();
                const clean = (k) => (localStorage.getItem(k) || '').replace(/^"|"$/g, '').trim();
                try {
                    p.set('skemi_theme', clean('skemi-theme') || 'galaxy');
                    const bg = clean('skemi_bg_color'); if (bg) p.set('skemi_bg', bg);
                    const accent = clean('skemi_accent_color'); if (accent) p.set('skemi_accent', accent);
                    p.set('skemi_lang', clean('skemi_language') || 'vi');
                    p.set('skemi_api', location.origin);   // lets the embedded app reach /api/translate-ui-batch for i18n
                    // Real logged-in account id — skemi_quiz's own userId() reads
                    // this param and persists it, so ELO/bot/history are tied to
                    // the actual Skemi account instead of a random Guest_xxxx id.
                    const uid = localStorage.getItem('skemi_user_id');
                    if (uid) p.set('skemi_uid', uid);
                } catch (e) {}
                const s = p.toString();
                return s ? '?' + s : '';
            }

            async function probe() {
                try {
                    const ctrl = new AbortController();
                    const t = setTimeout(() => ctrl.abort(), 2500);
                    const r = await fetch(HEALTH_URL, { signal: ctrl.signal, cache: 'no-store' });
                    clearTimeout(t);
                    return r.ok;
                } catch (e) { return false; }
            }

            async function connect() {
                // Start loading the embedded app IMMEDIATELY (parallel with the health
                // check) so it appears as fast as the native sections. The old code
                // ran a ~2.5s health probe FIRST and only then set the iframe src,
                // which is why entering this section "loaded" for a few seconds.
                if (!frame.getAttribute('src')) {
                    frame.src = SERVICE_URL + identityQuery();
                    frame.addEventListener('load', () => { connected = true; offline.classList.add('hidden'); }, { once: true });
                }
                // The probe now only decides whether to KEEP showing the offline card.
                const ok = await probe();
                if (ok) { connected = true; offline.classList.add('hidden'); }
                else if (!connected) { offline.classList.remove('hidden'); }
            }

            retry.addEventListener('click', connect);
            connect();
            const poll = setInterval(() => { if (connected) { clearInterval(poll); } else { connect(); } }, 4000);
        })();
    </script>
